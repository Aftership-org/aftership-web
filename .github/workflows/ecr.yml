name: Frontend CI and ECR

on:
  pull_request:
    paths:
      - "aftership-frontend/**"
      - ".github/workflows/ecr.yml"
  push:
    branches:
      - main
    paths:
      - "aftership-frontend/**"
      - ".github/workflows/ecr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ecr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: aftership-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aftership-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build application
        run: npm run build

  publish:
    name: Build and push image
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: ./aftership-frontend
          file: ./aftership-frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Publish image summary
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "### Published frontend image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$IMAGE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
